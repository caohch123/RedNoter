services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhaixing
      POSTGRES_USER: zhaixing
      POSTGRES_PASSWORD: zhaixing
    ports:
      - "127.0.0.1:${ZHAIXING_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhaixing"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${ZHAIXING_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - redis:/data
volumes:
  postgres:
  redis:
